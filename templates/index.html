<!DOCTYPE html>
<html>
<head>
    <title>Twitter Sentiment Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">💬 Twitter Sentiment Analyzer</h1>
    <form method="POST">
        <div class="mb-3">
            <textarea class="form-control" name="tweet" rows="4" placeholder="Enter a tweet..."></textarea>
        </div>
        <div class="text-center">
            <button class="btn btn-primary px-5" type="submit">Analyze</button>
        </div>
    </form>
    {% if prediction %}
    <div class="result text-center mt-4">
        <h3>Sentiment: <span class="badge bg-success">{{ prediction }} {{ emoji }}</span></h3>
    </div>
    {% endif %}
</div>
</body>
</html>
